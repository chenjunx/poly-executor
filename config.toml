[chain]
# Polygon 主网 RPC，用于 merge_positions 等链上操作
# 建议换成 Alchemy/Infura 专用 RPC 以提高稳定性
rpc_url = "https://polygon-rpc.com"

[proxy]
# 代理地址，例如 "socks5://127.0.0.1:1080"
url = ""

[auth]
api_key     = ""
api_secret  = ""
passphrase  = ""
private_key = ""   # EIP-712 签名私钥（0x 开头）
funder      = ""   # 钱包地址

[order]
size_usdc = 10.0   # 每次套利投入的 USDC 总量

[simulation]
enabled = false    # true 时不真实下单，order gateway 只生成本地模拟订单事件

[market_maker]
# 是否启动做市策略；false 时不会读取 market_maker.csv
enabled = true
# 做市市场 CSV 文件；相对路径按可执行文件目录解析
file = "market_maker.csv"

# 单市场库存归一化上限，单位 USD；用于计算 inventory_ratio
max_inventory_usd = 60.0
# 库存比例超过该值认为超重，超重时减少报价档位
overweight_ratio = 0.7

# CSV 未配置 rewards_max_spread 时使用的默认最大报价偏离
# CSV 有 rewards_max_spread / reward_max_spread 时，CSV 优先
default_max_spread = 0.03
# 报价价格 tick，目标买价会向下取整到该 tick
tick_size = 0.01
# CSV 未配置 reward_min_size / rewards_min_size 时使用的默认最小 token 数量
min_size = 5.0
# 库存偏斜对报价 adjusted_mid 的最大调整幅度
max_skew = 0.01

# fair midpoint 波动率统计窗口，单位毫秒
volatility_window_ms = 300000
# 波动率检测所需最少样本数
volatility_min_samples = 5
# 窗口内 fair midpoint 最大值和最小值差超过该阈值时触发冷静期
volatility_threshold = 0.02

# 市场盘口 spread 异常后的冷静期，单位毫秒
spread_cooldown_ms = 60000
# fair midpoint 波动率过高后的冷静期，单位毫秒
volatility_cooldown_ms = 300000
# fair midpoint 超出安全价格区间后的冷静期，单位毫秒
fair_midpoint_cooldown_ms = 600000

# fair midpoint 安全区间；低于 min 或高于 max 时暂停该市场报价
fair_midpoint_min = 0.1
fair_midpoint_max = 0.9
# 市场盘口 spread > max_spread * 该倍数时认为异常
abnormal_market_spread_multiplier = 2.0

# 正常库存状态下最多报价档位数
normal_quote_levels = 3
# 库存超重状态下最多报价档位数
overweight_quote_levels = 2
# 每档距离 fair midpoint 的比例：distance = max_spread * level_ratio
level_ratios = [0.4, 0.55, 0.7]
# 每档目标美元金额：size = max(level_size_usd / price, min_size)
level_sizes_usd = [10.0, 20.0, 30.0]

# reconcile 判断当前挂单 size 接近目标 size 的容忍比例
reconcile_size_tolerance = 0.2

[app]
# 统一日志文件名
log_file = "poly-executor.log"
# 资产配置文件名
assets_file = "assets.csv"
# 触发告警所需的最小套利空间：1 - (ask0 + ask1) > min_diff
min_diff = 0.01
# 单个 token 的最大价差上限（ask - bid），超过则跳过
max_spread = 0.05
# bid/ask 的有效价格区间，超出则跳过
min_price = 0.02
max_price = 0.98
# 默认订阅连接数（未配置 topic 时使用）
default_threads = 3
sqlite_path = "/home/admin/orders.db"
# 行情/模拟/奖励市场池库；留空时默认使用 orders.db 同目录下的 market.db
market_sqlite_path = ""
# 是否将 WS 行情 tick 写入 SQLite（best_bid/ask 变化时落盘）
tick_store_enabled = false
# 是否将全量 book 快照和 last_trade_price 事件写入 SQLite
raw_store_enabled = false

[notification.dingtalk]
# liquidity_reward 订单成交（部分成交也算）时发送钉钉通知
enabled = false
# 钉钉机器人完整 webhook；真实值建议放到 config.local.toml
webhook = ""
# 钉钉机器人加签 secret；为空时不加签
secret = ""
# HTTP 请求超时秒数
timeout_secs = 5
# 通知队列长度；队列满时丢弃通知，不阻塞订单 websocket
queue_size = 1024

# 每个主题的订阅线程数，未列出的主题使用 default_threads
[topic_threads]
# cs = 2
# sports = 4
us_iran=1